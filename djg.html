<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>大乐透结果汇总统计</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 12px;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: #f5f6f8; color: #1c1c1e;
    font-size: 16px;
  }
  .card {
    background: #fff; border-radius: 12px; padding: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 14px;
  }
  h2 { font-size: 17px; margin: 0 0 10px; }
  textarea {
    width: 100%; min-height: 180px; border: 1px solid #d8d8de; border-radius: 10px;
    padding: 10px; font-size: 14px; line-height: 1.5; resize: vertical;
    font-family: -apple-system, "PingFang SC", monospace; outline: none;
  }
  textarea:focus { border-color: #007aff; }
  .btn-row { display: flex; gap: 10px; margin-top: 10px; }
  button {
    flex: 1; border: none; border-radius: 10px; padding: 12px 0;
    font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .btn-add { background: #007aff; color: #fff; }
  .btn-end { background: #34c759; color: #fff; }
  .btn-clear { background: #e9e9ee; color: #333; flex: 0 0 auto; padding: 12px 16px; }
  .btn-copy { background: #ff9500; color: #fff; flex: 0 0 auto; padding: 12px 20px; }
  button:active { opacity: .7; }
  #status { font-size: 14px; color: #666; margin-top: 8px; line-height: 1.6; }
  #result-wrap { display: none; }
  .result-head {
    position: sticky; top: 0; z-index: 10; background: #fff;
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 10px; gap: 10px;
  }
  #result {
    white-space: pre-wrap; word-break: break-all;
    font-size: 14px; line-height: 1.7; font-family: -apple-system, "PingFang SC", monospace;
    margin: 0;
  }
  .toast {
    position: fixed; left: 50%; top: 40%; transform: translate(-50%,-50%);
    background: rgba(0,0,0,.8); color: #fff; padding: 12px 24px;
    border-radius: 10px; font-size: 15px; display: none; z-index: 99;
  }
</style>
</head>
<body>

<div class="card">
  <h2>📝 输入结果</h2>
  <textarea id="input" placeholder="粘贴一组结果（如：🎯 全部最多中 4+1 ...）"></textarea>
  <div class="btn-row">
    <button class="btn-add" onclick="addGroup()">继续输入（添加本组）</button>
    <button class="btn-end" onclick="finish()">结束</button>
  </div>
  <div class="btn-row">
    <button class="btn-clear" onclick="clearAll()">清空全部</button>
  </div>
  <div id="status">已输入 0 组</div>
</div>

<div class="card" id="result-wrap">
  <div class="result-head">
    <h2 style="margin:0">📊 汇总结果</h2>
    <button class="btn-copy" id="copyBtn" onclick="copyResult()">复制</button>
  </div>
  <pre id="result"></pre>
</div>

<div class="toast" id="toast"></div>

<script>
let groups = [];
try { groups = JSON.parse(localStorage.getItem('lotto_groups') || '[]'); } catch(e) { groups = []; }

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 1500);
}

function updateStatus() {
  localStorage.setItem('lotto_groups', JSON.stringify(groups));
  document.getElementById('status').textContent = '已输入 ' + groups.length + ' 组';
}

// 归一化类型名称：前区胆拖2胆 -> 胆拖2胆
function normType(name) {
  name = name.trim();
  let m = name.match(/^(?:前区)?胆拖(\d)胆$/);
  if (m) return '胆拖' + m[1] + '胆';
  return name;
}

function parseGroup(text) {
  const lines = text.split(/\r?\n/);
  const d = {}; // type -> metrics
  function ensure(t) { if (!d[t]) d[t] = { bonusPct:null, winRowPct:null, winRows:null, backPct:null, backRows:null, hit4pct:null, hit4rows:null, hit3pct:null, hit3rows:null, det:{}, uniq:{} }; return d[t]; }

  for (let raw of lines) {
    let line = raw.trim();
    if (!line) continue;

    // 奖金情况：X奖金占比是P%(..)，有奖金的行数占比是Q%(n/m)
    let m = line.match(/^(全部|单式5个|复式\d+个|前区胆拖\d胆|胆拖\d胆)奖金占比是([\d.]+)%\([^)]*\)，有奖金的行数占比是([\d.]+)%\((\d+)\/(\d+)\)/);
    if (m) {
      const o = ensure(normType(m[1]));
      o.bonusPct = parseFloat(m[2]); o.winRowPct = parseFloat(m[3]); o.winRows = parseInt(m[4]);
      continue;
    }

    // 后区全中：X后区全中的行数比例：P%（n➗m）
    m = line.match(/^(全部|单式5个|复式\d+个|前区胆拖\d胆|胆拖\d胆)后区全中的行数比例[：:]([\d.]+)%（(\d+)➗(\d+)）/);
    if (m) {
      const o = ensure(normType(m[1]));
      o.backPct = parseFloat(m[2]); o.backRows = parseInt(m[3]);
      continue;
    }

    // 中4个 / 中3个：X中4个的行数占比是P%(n/m)
    m = line.match(/^(全部|单式5个|复式\d+个|前区胆拖\d胆|胆拖\d胆)中([34])个的行数占比是([\d.]+)%\((\d+)\/(\d+)\)/);
    if (m) {
      const o = ensure(normType(m[1]));
      if (m[2] === '4') { o.hit4pct = parseFloat(m[3]); o.hit4rows = parseInt(m[4]); }
      else { o.hit3pct = parseFloat(m[3]); o.hit3rows = parseInt(m[4]); }
      continue;
    }

    // 明细：X中4➕1的行数占比是P%(n/m)
    m = line.match(/^(全部|单式5个|复式\d+个|前区胆拖\d胆|胆拖\d胆)中([0-9]➕[0-9])的行数占比是([\d.]+)%\((\d+)\/(\d+)\)/);
    if (m) {
      const o = ensure(normType(m[1]));
      o.det[m[2]] = { pct: parseFloat(m[3]), rows: parseInt(m[4]) };
      continue;
    }

    // 不重复（仅单式5个）：中2个不重复的行数占比是P%(n/m) / 中2➕2不重复的行数占比是P%(n/m)
    m = line.match(/中([0-9]➕[0-9]|[234])个?不重复的行数占比是([\d.]+)%\((\d+)\/(\d+)\)/);
    if (m) {
      const o = ensure('单式5个');
      o.uniq[m[1]] = { pct: parseFloat(m[2]), rows: parseInt(m[3]) };
      continue;
    }
  }
  return d;
}

// ---- 输出生成 ----
const TYPE_ORDER = ['全部','单式5个','复式6个','复式7个','复式8个','复式9个','复式10个','复式11个','复式12个','复式13个','复式15个','复式18个','胆拖0胆','胆拖1胆','胆拖2胆','胆拖3胆','胆拖4胆'];
const DET_ORDER = ['4➕1','4➕0','3➕2','3➕1','2➕2','3➕0','2➕1','1➕2','0➕2'];
const UNIQ_ORDER = ['4','3','2','4➕1','4➕0','3➕2','3➕1','2➕2','3➕0','2➕1','1➕2','0➕2'];

function fmt(v, isPct) {
  if (isPct) return v.toFixed(2) + '%';
  return String(v);
}

// values: [{pct, rows}] -> "范围是A%-B%(一共N组，分别是 v1、v2)，行数范围是x-y(一共N组，分别是 ...)"
function rangeLine(items, withPct, withRows) {
  let s = '';
  if (withPct) {
    const pcts = items.map(i => i.pct);
    s += '行数占比范围是' + fmt(Math.min(...pcts), true) + '-' + fmt(Math.max(...pcts), true)
       + '(一共' + items.length + '组，分别是 ' + pcts.map(v => fmt(v, true)).join('、') + ')';
  }
  if (withRows) {
    const rows = items.map(i => i.rows);
    s += '，行数范围是' + Math.min(...rows) + '-' + Math.max(...rows)
       + '(一共' + items.length + '组，分别是 ' + rows.join('、') + ')';
  }
  return s;
}

function typesPresent(parsed, key) {
  return TYPE_ORDER.filter(t => parsed[t] && parsed[t][key] !== null && parsed[t][key] !== undefined);
}

function generateOutput() {
  const parsed = groups;
  const N = parsed.length;
  const out = [];
  out.push('一共输入了' + N + '组结果');
  out.push('');

  // ❗️奖金情况
  out.push('❗️奖金情况');
  out.push('');
  const bTypes = typesPresent(parsed, 'bonusPct');
  bTypes.forEach(t => {
    const items = parsed.filter(g => g[t] && g[t].bonusPct !== null).map(g => ({ pct: g[t].bonusPct, rows: g[t].winRows, rp: g[t].winRowPct }));
    const n = items.length;
    const rps = items.map(i => i.rp);
    out.push(t + '奖金占比范围是' + fmt(Math.min(...items.map(i=>i.pct)), true) + '-' + fmt(Math.max(...items.map(i=>i.pct)), true)
      + '(一共' + n + '组，分别是 ' + items.map(i => fmt(i.pct, true)).join('、') + ')'
      + '，有奖金的行数占比范围是' + fmt(Math.min(...rps), true) + '-' + fmt(Math.max(...rps), true)
      + '(一共' + n + '组，分别是 ' + rps.map(v => fmt(v, true)).join('、') + ')'
      + '，有奖金的行数范围是' + Math.min(...items.map(i=>i.rows)) + '-' + Math.max(...items.map(i=>i.rows))
      + '(一共' + n + '组，分别是 ' + items.map(i => i.rows).join('、') + ')');
  });
  out.push('');

  // ❗️后区全中情况
  out.push('❗️后区全中情况');
  out.push('');
  typesPresent(parsed, 'backPct').forEach(t => {
    const items = parsed.filter(g => g[t] && g[t].backPct !== null).map(g => ({ pct: g[t].backPct, rows: g[t].backRows }));
    const n = items.length;
    out.push(t + '后区全中的行数比例范围是' + fmt(Math.min(...items.map(i=>i.pct)), true) + '-' + fmt(Math.max(...items.map(i=>i.pct)), true)
      + '(一共' + n + '组，分别是 ' + items.map(i => fmt(i.pct, true)).join('、') + '）'
      + '，行数范围是' + Math.min(...items.map(i=>i.rows)) + '-' + Math.max(...items.map(i=>i.rows))
      + '(一共' + n + '组，分别是 ' + items.map(i => i.rows).join('、') + '）');
  });
  out.push('');

  // ❗️中4个 / 中3个情况
  [['hit4pct', '❗️中4个情况'], ['hit3pct', '❗️中3个情况']].forEach(([key, title]) => {
    out.push(title);
    out.push('');
    typesPresent(parsed, key).forEach(t => {
      const rk = key === 'hit4pct' ? 'hit4rows' : 'hit3rows';
      const items = parsed.filter(g => g[t] && g[t][key] !== null).map(g => ({ pct: g[t][key], rows: g[t][rk] }));
      const n = items.length;
      out.push(t + '中' + (key === 'hit4pct' ? '4' : '3') + '个的行数占比范围是' + fmt(Math.min(...items.map(i=>i.pct)), true) + '-' + fmt(Math.max(...items.map(i=>i.pct)), true)
        + '(一共' + n + '组，分别是 ' + items.map(i => fmt(i.pct, true)).join('、') + '）'
        + '，行数范围是' + Math.min(...items.map(i=>i.rows)) + '-' + Math.max(...items.map(i=>i.rows))
        + '(一共' + n + '组，分别是 ' + items.map(i => i.rows).join('、') + '）');
    });
    out.push('');
  });

  // ❗️明细
  DET_ORDER.forEach(det => {
    const tList = TYPE_ORDER.filter(t => parsed.some(g => g[t] && g[t].det[det]));
    if (!tList.length) return;
    out.push('❗️中' + det + '详情');
    out.push('');
    tList.forEach(t => {
      const items = parsed.filter(g => g[t] && g[t].det[det]).map(g => g[t].det[det]);
      out.push(t + '中' + det + '的行数占比范围是' + fmt(Math.min(...items.map(i=>i.pct)), true) + '-' + fmt(Math.max(...items.map(i=>i.pct)), true)
        + '(一共' + items.length + '组，分别是 ' + items.map(i => fmt(i.pct, true)).join('、') + '）'
        + '，行数范围是' + Math.min(...items.map(i=>i.rows)) + '-' + Math.max(...items.map(i=>i.rows))
        + '(一共' + items.length + '组，分别是 ' + items.map(i => i.rows).join('、') + '）');
    });
    out.push('');
  });

  // ❗️单式5个有奖金的不重复行情况
  if (parsed.some(g => g['单式5个'] && Object.keys(g['单式5个'].uniq).length)) {
    out.push('❗️单式5个有奖金的不重复行情况');
    out.push('');
    UNIQ_ORDER.forEach(u => {
      const items = parsed.filter(g => g['单式5个'] && g['单式5个'].uniq[u]).map(g => g['单式5个'].uniq[u]);
      if (!items.length) return;
      out.push('单式5个中' + u + '的行数占比范围是' + fmt(Math.min(...items.map(i=>i.pct)), true) + '-' + fmt(Math.max(...items.map(i=>i.pct)), true)
        + '(一共' + items.length + '组，分别是 ' + items.map(i => fmt(i.pct, true)).join('、') + '）'
        + '，行数范围是' + Math.min(...items.map(i=>i.rows)) + '-' + Math.max(...items.map(i=>i.rows))
        + '(一共' + items.length + '组，分别是 ' + items.map(i => i.rows).join('、') + '）');
    });
  }

  return out.join('\n');
}

function addGroup() {
  const ta = document.getElementById('input');
  const text = ta.value.trim();
  if (!text) { toast('请先粘贴内容'); return; }
  const parsed = parseGroup(text);
  if (!Object.keys(parsed).length) { toast('未识别到有效数据，请检查格式'); return; }
  groups.push(parsed);
  ta.value = '';
  updateStatus();
  toast('已添加第 ' + groups.length + ' 组');
}

function finish() {
  const ta = document.getElementById('input');
  if (ta.value.trim()) addGroup();
  if (!groups.length) { toast('尚未输入任何数据'); return; }
  const out = generateOutput();
  document.getElementById('result').textContent = out;
  document.getElementById('result-wrap').style.display = 'block';
  document.getElementById('result-wrap').scrollIntoView({ behavior: 'smooth' });
}

async function copyResult() {
  const text = document.getElementById('result').textContent;
  try {
    await navigator.clipboard.writeText(text);
    toast('已复制');
  } catch(e) {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    toast('已复制');
  }
  const btn = document.getElementById('copyBtn');
  btn.textContent = '已复制✓';
  setTimeout(() => btn.textContent = '复制', 2000);
}

function clearAll() {
  if (!groups.length) return;
  if (!confirm('确定清空已输入的全部 ' + groups.length + ' 组数据？')) return;
  groups = [];
  updateStatus();
  document.getElementById('result-wrap').style.display = 'none';
  toast('已清空');
}

updateStatus();
</script>
</body>
</html>
