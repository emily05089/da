<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>结果统计汇总</title>
<style>
  :root{
    --bg:#f5f6f8;
    --card:#ffffff;
    --line:#e5e7eb;
    --primary:#3b82f6;
    --text:#1f2937;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ width:100%; max-width:100%; overflow-x:hidden; }
  body{
    margin:0;
    padding-top:14px;
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
    padding-left:calc(12px + env(safe-area-inset-left));
    padding-right:calc(12px + env(safe-area-inset-right));
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:15px;
    line-height:1.6;
    -webkit-text-size-adjust:100%;
  }
  h1{
    font-size:18px;
    line-height:1.4;
    margin:0 0 10px;
    letter-spacing:.3px;
  }
  .status{
    background:#e8f0fe;
    border-left:4px solid var(--primary);
    padding:10px 12px;
    border-radius:8px;
    margin-bottom:12px;
    font-size:13.5px;
    line-height:1.55;
    color:#1e40af;
    word-break:break-word;
  }
  textarea{
    display:block;
    width:100%;
    height:200px;
    padding:12px;
    border:1px solid #d0d5dd;
    border-radius:10px;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:16px;
    line-height:1.5;
    resize:vertical;
    background:#fff;
    color:var(--text);
    outline:none;
    -webkit-appearance:none;
    appearance:none;
  }
  textarea:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(59,130,246,.15);
  }
  .btns{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin:12px 0;
  }
  .btns.single{ grid-template-columns:1fr; }
  button{
    width:100%;
    min-height:46px;
    padding:11px 12px;
    border:none;
    border-radius:10px;
    font-size:15px;
    font-weight:500;
    font-family:inherit;
    color:#fff;
    background:var(--primary);
    cursor:pointer;
    transition:filter .15s, opacity .15s;
    -webkit-appearance:none;
    appearance:none;
    touch-action:manipulation;
  }
  button:active:not(:disabled){ filter:brightness(.93); }
  button:disabled{ opacity:.45; cursor:not-allowed; }
  button.danger{ background:#ef4444; }
  button.copy{ background:#10b981; font-weight:600; }
  #resultWrap{ display:none; margin-top:8px; }
  pre{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px;
    margin:0;
    font-family:ui-monospace,Menlo,Consolas,"PingFang SC",monospace;
    font-size:12.5px;
    line-height:1.75;
    color:#111827;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    word-break:break-word;
    max-height:66vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  @media (min-width:560px){
    body{ font-size:15px; padding-top:20px; }
    h1{ font-size:20px; }
    textarea{ height:230px; }
    pre{ font-size:13px; }
  }
</style>
</head>
<body>

<h1>📊 结果统计汇总</h1>

<div class="status" id="status">请粘贴第 1 组结果，然后点击【确定（录入本组）】。</div>

<textarea id="input" placeholder="在此粘贴结果（长按选择“粘贴”）..." autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>

<div class="btns">
  <button id="addBtn">✅ 确定</button>
  <button id="endBtn" disabled>🏁 结束输出</button>
</div>
<div class="btns single">
  <button id="resetBtn" class="danger">↺ 重新开始</button>
</div>

<div id="resultWrap">
  <div class="btns single">
    <button id="copyBtn" class="copy">📋 一键复制</button>
  </div>
  <pre id="resultText"></pre>
</div>

<script>
(function () {
  'use strict';

  var groups = [];
  var $ = function (id) { return document.getElementById(id); };
  var inputEl    = $('input'),
      statusEl   = $('status'),
      addBtn     = $('addBtn'),
      endBtn     = $('endBtn'),
      resetBtn   = $('resetBtn'),
      resultWrap = $('resultWrap'),
      resultText = $('resultText'),
      copyBtn    = $('copyBtn');

  /* ================= 工具 ================= */
  function normalizeText(t) {
    return String(t).replace(/\+/g, '➕');
  }
  function toNum(s) { return parseFloat(s); }
  function normCat(c) { return c.replace(/^前区/, ''); }

  /* ================= 解析单组 ================= */
  function parseOne(rawText) {
    var text = normalizeText(rawText);
    var res = {
      bonus:       { all: null, cats: {} },
      uniqueBonus: { all: null, cats: {} },
      back:        { all: null, cats: {} },
      uniqueBack:  { all: null, cats: {} },
      hits:        {},
      uniqueHits:  {}
    };

    var lines = text.split(/\r?\n/)
      .map(function (s) { return s.trim(); })
      .filter(function (s) { return s.length > 0; });

    var zone = null;

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];

      /* ---------- 区域切换 ---------- */
      if (/^❗/.test(line)) {
        var t = line.replace(/^❗\uFE0F?/, '').trim();

        if (/^不重复的奖金情况$/.test(t)) {
          zone = 'uniqueBonus';
        } else if (/^不重复的后区全中情况$/.test(t)) {
          zone = 'uniqueBack';
        } else if (/^不重复的中(.+?)情况$/.test(t)) {
          var m = t.match(/^不重复的中(.+?)情况$/);
          zone = 'uniqueHit:' + m[1];
        } else if (/^不重复的中(.+?)详情$/.test(t)) {
          var m = t.match(/^不重复的中(.+?)详情$/);
          zone = 'uniqueHit:' + m[1];
        } else if (/^奖金情况$/.test(t)) {
          zone = 'bonus';
        } else if (/^后区全中情况$/.test(t)) {
          zone = 'back';
        } else if (/^中(.+?)情况$/.test(t)) {
          var m = t.match(/^中(.+?)情况$/);
          zone = 'hit:' + m[1];
        } else if (/^中(.+?)详情$/.test(t)) {
          var m = t.match(/^中(.+?)详情$/);
          zone = 'hit:' + m[1];
        } else if (/^单式5个有奖金的不重复行情况$/.test(t)) {
          zone = null;
        } else {
          zone = null;
        }
        continue;
      }
      if (!zone) continue;

      /* ---------- 奖金类 ---------- */
      if (zone === 'bonus' || zone === 'uniqueBonus') {
        var mb = line.match(
          /^(.*?)奖金占比是([\d.]+)%[（(]([\d,，]+)元[\/／]([\d,，]+)元[）)][，,]?\s*有奖金的行数占比是([\d.]+)%[（(](\d+)[\/／](\d+)[）)]/
        );
        if (!mb) continue;
        var bcat = mb[1].trim();
        var bval = {
          pct:    toNum(mb[2]),
          amount: toNum(mb[3].replace(/[,，]/g, '')),
          total:  toNum(mb[4].replace(/[,，]/g, '')),
          winPct: toNum(mb[5]),
          winNum: parseInt(mb[6], 10),
          winDen: parseInt(mb[7], 10)
        };
        var target = zone === 'bonus' ? res.bonus : res.uniqueBonus;
        if (bcat === '全部') target.all = bval;
        else target.cats[normCat(bcat)] = bval;
        continue;
      }

      /* ---------- 后区全中类（冒号可选、空白宽松，兼容全角半角括号和➗/） ---------- */
      if (zone === 'back' || zone === 'uniqueBack') {
        var mk = line.match(
          /^(.*?)后区全中的行数比例[ \t\u3000]*[：:]?[ \t\u3000]*([\d.]+)%[ \t\u3000]*[（(][ \t\u3000]*(\d+)[ \t\u3000]*[➗\/][ \t\u3000]*(\d+)[ \t\u3000]*[）)]/
        );
        if (!mk) continue;
        var kcat = mk[1].trim();
        var kval = { pct: toNum(mk[2]), num: parseInt(mk[3], 10), den: parseInt(mk[4], 10) };
        var target = zone === 'back' ? res.back : res.uniqueBack;
        if (kcat === '全部') target.all = kval;
        else target.cats[normCat(kcat)] = kval;
        continue;
      }

      /* ---------- 命中类（普通 / 不重复） ---------- */
      if (zone.indexOf('hit:') === 0 || zone.indexOf('uniqueHit:') === 0) {
        var isUnique = zone.indexOf('uniqueHit:') === 0;
        var mh = line.match(
          /^(.*?)中(.+?)的行数占比是([\d.]+)%[（(](\d+)[\/／](\d+)[）)]/
        );
        if (!mh) continue;
        var hcat = mh[1].trim();
        var desc = mh[2].trim();
        var key = desc.replace(/个$/, '');
        var hval = { pct: toNum(mh[3]), num: parseInt(mh[4], 10), den: parseInt(mh[5], 10) };
        var store = isUnique ? res.uniqueHits : res.hits;
        if (!store[key]) store[key] = { all: null, cats: {} };
        if (hcat === '全部') store[key].all = hval;
        else store[key].cats[normCat(hcat)] = hval;
      }
    }

    return res;
  }

  /* ================= 类别排序 ================= */
  function catKey(c) {
    var m = c.match(/^单式(\d+)个$/);  if (m) return [0, +m[1]];
    m = c.match(/^复式(\d+)个$/);      if (m) return [1, +m[1]];
    m = c.match(/^胆拖(\d+)胆$/);      if (m) return [2, +m[1]];
    return [3, 0];
  }
  function catUnion(getter) {
    var set = {};
    groups.forEach(function (g) {
      var o = getter(g);
      if (!o) return;
      Object.keys(o).forEach(function (k) { set[k] = 1; });
    });
    return Object.keys(set).sort(function (a, b) {
      var ka = catKey(a), kb = catKey(b);
      if (ka[0] !== kb[0]) return ka[0] - kb[0];
      if (ka[1] !== kb[1]) return ka[1] - kb[1];
      return a.localeCompare(b);
    });
  }

  /* ================= 取值 / 区间文本 ================= */
  function collect(fn) {
    var arr = [];
    groups.forEach(function (g) {
      var v = fn(g);
      if (v !== undefined && v !== null && !isNaN(v)) arr.push(v);
    });
    return arr;
  }
  function pctRange(label, arr) {
    if (!arr.length) return '';
    var min  = Math.min.apply(null, arr).toFixed(2);
    var max  = Math.max.apply(null, arr).toFixed(2);
    var list = arr.map(function (v) { return v.toFixed(2) + '%'; }).join('、');
    return label + '范围是' + min + '%-' + max + '%(一共' + arr.length + '组，分别是' + list + ')';
  }
  function numRange(label, arr) {
    if (!arr.length) return '';
    var min  = Math.min.apply(null, arr);
    var max  = Math.max.apply(null, arr);
    var list = arr.join('、');
    return label + '范围是' + min + '-' + max + '(一共' + arr.length + '组，分别是' + list + ')';
  }
  function joinRanges() {
    return Array.prototype.slice.call(arguments).filter(Boolean).join('，');
  }
  function block(title, entries) {
    if (!entries.length) return '';
    return title + '\n\n' + entries.join('\n\n') + '\n\n';
  }

  /* ================= 各区块生成器 ================= */

  function buildBonusBlock(title, getTarget) {
    var allPct = collect(function (g) {
      var t = getTarget(g);
      return t.all && t.all.pct;
    });
    if (!allPct.length) return '';

    var entries = [];
    entries.push(joinRanges(
      pctRange('全部奖金占比', allPct),
      pctRange('有奖金的行数占比',
        collect(function (g) { var t = getTarget(g); return t.all && t.all.winPct; })),
      numRange('有奖金的行数',
        collect(function (g) { var t = getTarget(g); return t.all && t.all.winNum; }))
    ));

    catUnion(function (g) { return getTarget(g).cats; }).forEach(function (c) {
      entries.push(joinRanges(
        pctRange(c + '奖金占比',
          collect(function (g) { var t = getTarget(g); return t.cats[c] && t.cats[c].pct; })),
        pctRange('有奖金的行数占比',
          collect(function (g) { var t = getTarget(g); return t.cats[c] && t.cats[c].winPct; })),
        numRange('有奖金的行数',
          collect(function (g) { var t = getTarget(g); return t.cats[c] && t.cats[c].winNum; }))
      ));
    });

    return block(title, entries);
  }

  function buildBackBlock(title, getTarget) {
    var allPct = collect(function (g) {
      var t = getTarget(g);
      return t.all && t.all.pct;
    });
    if (!allPct.length) return '';

    var entries = [];
    entries.push(joinRanges(
      pctRange('全部后区全中的行数比例', allPct),
      numRange('行数',
        collect(function (g) { var t = getTarget(g); return t.all && t.all.num; }))
    ));

    catUnion(function (g) { return getTarget(g).cats; }).forEach(function (c) {
      entries.push(joinRanges(
        pctRange(c + '后区全中的行数比例',
          collect(function (g) { var t = getTarget(g); return t.cats[c] && t.cats[c].pct; })),
        numRange('行数',
          collect(function (g) { var t = getTarget(g); return t.cats[c] && t.cats[c].num; }))
      ));
    });

    return block(title, entries);
  }

  function buildHitBlock(title, storeKey, getStore) {
    var has = groups.some(function (g) {
      var store = getStore(g);
      return !!store[storeKey];
    });
    if (!has) return '';

    var entries = [];
    entries.push(joinRanges(
      pctRange('全部中' + storeKey + '的行数占比',
        collect(function (g) { var s = getStore(g)[storeKey]; return s && s.all && s.all.pct; })),
      numRange('行数',
        collect(function (g) { var s = getStore(g)[storeKey]; return s && s.all && s.all.num; }))
    ));

    catUnion(function (g) { var s = getStore(g)[storeKey]; return s && s.cats; }).forEach(function (c) {
      entries.push(joinRanges(
        pctRange(c + '中' + storeKey + '的行数占比',
          collect(function (g) { var s = getStore(g)[storeKey]; return s && s.cats[c] && s.cats[c].pct; })),
        numRange('行数',
          collect(function (g) { var s = getStore(g)[storeKey]; return s && s.cats[c] && s.cats[c].num; }))
      ));
    });

    return block(title, entries);
  }

  function buildUniqueHitBlock(title, storeKey, getStore) {
    var has = groups.some(function (g) {
      var store = getStore(g);
      return !!store[storeKey];
    });
    if (!has) return '';

    var entries = [];
    var allPct = collect(function (g) { var s = getStore(g)[storeKey]; return s && s.all && s.all.pct; });
    if (allPct.length) {
      entries.push(joinRanges(
        pctRange('全部中' + storeKey + '的行数占比', allPct),
        numRange('行数',
          collect(function (g) { var s = getStore(g)[storeKey]; return s && s.all && s.all.num; }))
      ));
    }

    var hasSingle = groups.some(function (g) {
      var s = getStore(g)[storeKey];
      return s && s.cats['单式5个'];
    });
    if (hasSingle) {
      entries.push(joinRanges(
        pctRange('单式5个中' + storeKey + '的行数占比',
          collect(function (g) { var s = getStore(g)[storeKey]; return s && s.cats['单式5个'] && s.cats['单式5个'].pct; })),
        numRange('行数',
          collect(function (g) { var s = getStore(g)[storeKey]; return s && s.cats['单式5个'] && s.cats['单式5个'].num; }))
      ));
    }

    return block(title, entries);
  }

  function buildUniqueBonusBlock(title, getTarget) {
    var allPct = collect(function (g) { var t = getTarget(g); return t.all && t.all.pct; });
    if (!allPct.length) return '';

    var entries = [];
    entries.push(joinRanges(
      pctRange('全部奖金占比', allPct),
      pctRange('有奖金的行数占比',
        collect(function (g) { var t = getTarget(g); return t.all && t.all.winPct; })),
      numRange('有奖金的行数',
        collect(function (g) { var t = getTarget(g); return t.all && t.all.winNum; }))
    ));

    var hasSingle = groups.some(function (g) { return !!getTarget(g).cats['单式5个']; });
    if (hasSingle) {
      entries.push(joinRanges(
        pctRange('单式5个奖金占比',
          collect(function (g) { var t = getTarget(g); return t.cats['单式5个'] && t.cats['单式5个'].pct; })),
        pctRange('有奖金的行数占比',
          collect(function (g) { var t = getTarget(g); return t.cats['单式5个'] && t.cats['单式5个'].winPct; })),
        numRange('有奖金的行数',
          collect(function (g) { var t = getTarget(g); return t.cats['单式5个'] && t.cats['单式5个'].winNum; }))
      ));
    }

    return block(title, entries);
  }

  function buildUniqueBackBlock(title, getTarget) {
    var allPct = collect(function (g) { var t = getTarget(g); return t.all && t.all.pct; });
    if (!allPct.length) return '';

    var entries = [];
    entries.push(joinRanges(
      pctRange('全部后区全中的行数比例', allPct),
      numRange('行数',
        collect(function (g) { var t = getTarget(g); return t.all && t.all.num; }))
    ));

    var hasSingle = groups.some(function (g) { return !!getTarget(g).cats['单式5个']; });
    if (hasSingle) {
      entries.push(joinRanges(
        pctRange('单式5个后区全中的行数比例',
          collect(function (g) { var t = getTarget(g); return t.cats['单式5个'] && t.cats['单式5个'].pct; })),
        numRange('行数',
          collect(function (g) { var t = getTarget(g); return t.cats['单式5个'] && t.cats['单式5个'].num; }))
      ));
    }

    return block(title, entries);
  }

  /* ================= 汇总生成 ================= */
  function buildResult() {
    var out = '';
    out += '一共输入了' + groups.length + '组结果\n\n';

    out += buildBonusBlock('❗️奖金情况', function (g) { return g.bonus; });
    out += buildUniqueBonusBlock('❗️不重复的奖金情况', function (g) { return g.uniqueBonus; });
    out += buildBackBlock('❗️后区全中情况', function (g) { return g.back; });
    out += buildUniqueBackBlock('❗️不重复的后区全中情况', function (g) { return g.uniqueBack; });
    out += buildHitBlock('❗️中4个情况', '4', function (g) { return g.hits; });
    out += buildHitBlock('❗️中3个情况', '3', function (g) { return g.hits; });
    out += buildUniqueHitBlock('❗️不重复的中3个情况', '3', function (g) { return g.uniqueHits; });
    out += buildHitBlock('❗️中2➕2和2➕1的情况', '2➕2和2➕1', function (g) { return g.hits; });
    out += buildUniqueHitBlock('❗️不重复的中2➕2和2➕1的情况', '2➕2和2➕1', function (g) { return g.uniqueHits; });
    out += buildHitBlock('❗️中4➕1详情', '4➕1', function (g) { return g.hits; });
    out += buildHitBlock('❗️中4➕0详情', '4➕0', function (g) { return g.hits; });
    out += buildHitBlock('❗️中3➕2详情', '3➕2', function (g) { return g.hits; });
    out += buildHitBlock('❗️中3➕1详情', '3➕1', function (g) { return g.hits; });
    out += buildUniqueHitBlock('❗️不重复的中3➕1详情', '3➕1', function (g) { return g.uniqueHits; });
    out += buildHitBlock('❗️中2➕2详情', '2➕2', function (g) { return g.hits; });
    out += buildUniqueHitBlock('❗️不重复的中2➕2详情', '2➕2', function (g) { return g.uniqueHits; });
    out += buildHitBlock('❗️中3➕0详情', '3➕0', function (g) { return g.hits; });
    out += buildUniqueHitBlock('❗️不重复的中3➕0详情', '3➕0', function (g) { return g.uniqueHits; });
    out += buildHitBlock('❗️中2➕1详情', '2➕1', function (g) { return g.hits; });
    out += buildUniqueHitBlock('❗️不重复的中2➕1详情', '2➕1', function (g) { return g.uniqueHits; });
    out += buildHitBlock('❗️中1➕2详情', '1➕2', function (g) { return g.hits; });
    out += buildUniqueHitBlock('❗️不重复的中1➕2详情', '1➕2', function (g) { return g.uniqueHits; });
    out += buildHitBlock('❗️中0➕2详情', '0➕2', function (g) { return g.hits; });
    out += buildUniqueHitBlock('❗️不重复的中0➕2详情', '0➕2', function (g) { return g.uniqueHits; });

    return out.replace(/\n{3,}/g, '\n\n').trim();
  }

  /* ================= 事件 ================= */
  addBtn.addEventListener('click', function () {
    var txt = inputEl.value.trim();
    if (!txt) { alert('请先粘贴结果内容'); return; }

    var parsed;
    try { parsed = parseOne(txt); }
    catch (e) { alert('解析出错：' + e.message); return; }

    var ok = parsed.bonus.all || Object.keys(parsed.hits).length > 0 || parsed.back.all;
    if (!ok) { alert('未识别到有效内容，请检查粘贴的格式是否正确。'); return; }

    groups.push(parsed);
    inputEl.value = '';
    resultWrap.style.display = 'none';

    statusEl.textContent = '已录入第 ' + groups.length + ' 组结果。请继续粘贴下一组，或点击【结束输出】。';
    endBtn.disabled = false;
    inputEl.focus();
  });

  endBtn.addEventListener('click', function () {
    if (!groups.length) { alert('还没有录入任何结果'); return; }
    resultText.textContent = buildResult();
    resultWrap.style.display = 'block';
    statusEl.textContent = '✅ 统计完成，共 ' + groups.length + ' 组结果。点击【一键复制】即可复制。';
    resultWrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  resetBtn.addEventListener('click', function () {
    if (!confirm('确定要清空所有已录入的结果吗？')) return;
    groups = [];
    inputEl.value = '';
    resultText.textContent = '';
    resultWrap.style.display = 'none';
    endBtn.disabled = true;
    statusEl.textContent = '请粘贴第 1 组结果，然后点击【确定（录入本组）】。';
    inputEl.focus();
  });

  copyBtn.addEventListener('click', function () {
    var text = resultText.textContent;
    if (!text) return;

    var done = function () {
      var old = copyBtn.textContent;
      copyBtn.textContent = '✅ 已复制';
      setTimeout(function () { copyBtn.textContent = old; }, 1500);
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () {
        fallbackCopy(text, done);
      });
    } else {
      fallbackCopy(text, done);
    }
  });

  function fallbackCopy(text, cb) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    if (cb) cb();
  }

})();
</script>
</body>
</html>
