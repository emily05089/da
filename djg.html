<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>结果统计汇总</title>
<style>
  :root{
    --bg:#f5f6f8;
    --card:#ffffff;
    --line:#e5e7eb;
    --primary:#3b82f6;
    --text:#1f2937;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ width:100%; max-width:100%; overflow-x:hidden; }
  body{
    margin:0;
    padding-top:14px;
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
    padding-left:calc(12px + env(safe-area-inset-left));
    padding-right:calc(12px + env(safe-area-inset-right));
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:15px;
    line-height:1.6;
    -webkit-text-size-adjust:100%;
  }
  h1{
    font-size:18px;
    line-height:1.4;
    margin:0 0 10px;
    letter-spacing:.3px;
  }
  .status{
    background:#e8f0fe;
    border-left:4px solid var(--primary);
    padding:10px 12px;
    border-radius:8px;
    margin-bottom:12px;
    font-size:13.5px;
    line-height:1.55;
    color:#1e40af;
    word-break:break-word;
  }
  textarea{
    display:block;
    width:100%;
    height:200px;
    padding:12px;
    border:1px solid #d0d5dd;
    border-radius:10px;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:16px;
    line-height:1.5;
    resize:vertical;
    background:#fff;
    color:var(--text);
    outline:none;
    -webkit-appearance:none;
    appearance:none;
  }
  textarea:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(59,130,246,.15);
  }
  .btns{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin:12px 0;
  }
  .btns.single{ grid-template-columns:1fr; }
  button{
    width:100%;
    min-height:46px;
    padding:11px 12px;
    border:none;
    border-radius:10px;
    font-size:15px;
    font-weight:500;
    font-family:inherit;
    color:#fff;
    background:var(--primary);
    cursor:pointer;
    transition:filter .15s, opacity .15s;
    -webkit-appearance:none;
    appearance:none;
    touch-action:manipulation;
  }
  button:active:not(:disabled){ filter:brightness(.93); }
  button:disabled{ opacity:.45; cursor:not-allowed; }
  button.danger{ background:#ef4444; }
  button.copy{ background:#10b981; font-weight:600; }
  #resultWrap{ display:none; margin-top:8px; }
  pre{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px;
    margin:0;
    font-family:ui-monospace,Menlo,Consolas,"PingFang SC",monospace;
    font-size:12.5px;
    line-height:1.75;
    color:#111827;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    word-break:break-word;
    max-height:66vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  @media (min-width:560px){
    body{ font-size:15px; padding-top:20px; }
    h1{ font-size:20px; }
    textarea{ height:230px; }
    pre{ font-size:13px; }
  }
</style>
</head>
<body>

<h1>📊 结果统计汇总</h1>

<div class="status" id="status">请粘贴第 1 组结果，然后点击【确定（录入本组）】。</div>

<textarea id="input" placeholder="在此粘贴结果（长按选择“粘贴”）..." autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>

<div class="btns">
  <button id="addBtn">✅ 确定</button>
  <button id="endBtn" disabled>🏁 结束输出</button>
</div>
<div class="btns single">
  <button id="resetBtn" class="danger">↺ 重新开始</button>
</div>

<div id="resultWrap">
  <div class="btns single">
    <button id="copyBtn" class="copy">📋 一键复制</button>
  </div>
  <pre id="resultText"></pre>
</div>

<script>
(function () {
  'use strict';

  var groups = [];
  var $ = function (id) { return document.getElementById(id); };
  var inputEl    = $('input'),
      statusEl   = $('status'),
      addBtn     = $('addBtn'),
      endBtn     = $('endBtn'),
      resetBtn   = $('resetBtn'),
      resultWrap = $('resultWrap'),
      resultText = $('resultText'),
      copyBtn    = $('copyBtn');

  /* ================= 工具 ================= */
  function normalizeText(t) {
    return String(t).replace(/\+/g, '➕');   // 半角 + → 全角 ➕
  }
  function toNum(s) { return parseFloat(s); }
  function normCat(c) { return c.replace(/^前区/, ''); }

  /* ================= 解析单组 ================= */
  function parseOne(rawText) {
    var text = normalizeText(rawText);
    var res = {
      bonus: { all: null, cats: {} },
      back:  { all: null, cats: {} },
      hits:  {},
      unique:{ byCount: {}, byCombo: {} }
    };

    var lines = text.split(/\r?\n/)
      .map(function (s) { return s.trim(); })
      .filter(function (s) { return s.length > 0; });

    var zone = null;

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];

      /* ---------- 区域切换 ---------- */
      if (/^❗/.test(line)) {
        var t = line.replace(/^❗\uFE0F?/, '').trim();

        if (/重复行/.test(t))            zone = 'unique';
        else if (/后区全中/.test(t))     zone = 'back';
        else if (/奖金情况/.test(t))     zone = 'bonus';
        else {
          // 匹配「中4个情况」「中3个情况」「中4➕1详情」等
          var mh = t.match(/^中(\d➕\d|\d+)个?(?:情况|详情)$/);
          zone = mh ? ('hit:' + mh[1]) : null;
        }
        continue;
      }
      if (!zone) continue;

      /* ---------- 奖金情况 ---------- */
      if (zone === 'bonus') {
        var mb = line.match(
          /^(.*?)奖金占比是([\d.]+)%[（(]([\d,，]+)元[\/／]([\d,，]+)元[）)][，,]?\s*有奖金的行数占比是([\d.]+)%[（(](\d+)[\/／](\d+)[）)]/
        );
        if (!mb) continue;
        var bcat = mb[1].trim();
        var bval = {
          pct:    toNum(mb[2]),
          amount: toNum(mb[3].replace(/[,，]/g, '')),
          total:  toNum(mb[4].replace(/[,，]/g, '')),
          winPct: toNum(mb[5]),
          winNum: parseInt(mb[6], 10),
          winDen: parseInt(mb[7], 10)
        };
        if (bcat === '全部') res.bonus.all = bval;
        else res.bonus.cats[normCat(bcat)] = bval;
        continue;
      }

      /* ---------- 后区全中 ---------- */
      if (zone === 'back') {
        var mk = line.match(
          /^(.*?)后区全中的行数比例：\s*([\d.]+)%[（(](\d+)\s*[➗\/]\s*(\d+)[）)]/
        );
        if (!mk) continue;
        var kcat = mk[1].trim();
        var kval = { pct: toNum(mk[2]), num: parseInt(mk[3], 10), den: parseInt(mk[4], 10) };
        if (kcat === '全部') res.back.all = kval;
        else res.back.cats[normCat(kcat)] = kval;
        continue;
      }

      /* ---------- 有奖金的重复行情况（仅单式5个） ---------- */
      if (zone === 'unique') {
        // 其中2➕2不重复的有1行，中2➕2不重复的行数占比是0.37%(1/270)
        var mu1 = line.match(
          /^其中(\d➕\d)不重复的有(\d+)行[，,]?\s*中\d➕\d不重复的行数占比是([\d.]+)%[（(](\d+)[\/／](\d+)[）)]/
        );
        if (mu1) {
          res.unique.byCombo[mu1[1]] = {
            rows: parseInt(mu1[2], 10),
            pct:  toNum(mu1[3]),
            num:  parseInt(mu1[4], 10),
            den:  parseInt(mu1[5], 10)
          };
          continue;
        }
        // 单式5个中2个不重复的有5行，中2个不重复的行数占比是1.85%(5/270)
        var mu2 = line.match(
          /^(.*?)中(\d)个不重复的有(\d+)行[，,]?\s*中\d个不重复的行数占比是([\d.]+)%[（(](\d+)[\/／](\d+)[）)]/
        );
        if (mu2) {
          res.unique.byCount[mu2[2]] = {
            rows: parseInt(mu2[3], 10),
            pct:  toNum(mu2[4]),
            num:  parseInt(mu2[5], 10),
            den:  parseInt(mu2[6], 10)
          };
        }
        continue;
      }

      /* ---------- 中X个 / 中X➕Y ---------- */
      if (zone.indexOf('hit:') === 0) {
        var mh2 = line.match(
          /^(.*?)中(\d➕\d|\d)个?的行数占比是([\d.]+)%[（(](\d+)[\/／](\d+)[）)]/
        );
        if (!mh2) continue;
        var hcat = mh2[1].trim();
        var hkey = mh2[2];
        var hval = { pct: toNum(mh2[3]), num: parseInt(mh2[4], 10), den: parseInt(mh2[5], 10) };
        if (!res.hits[hkey]) res.hits[hkey] = { all: null, cats: {} };
        if (hcat === '全部') res.hits[hkey].all = hval;
        else res.hits[hkey].cats[normCat(hcat)] = hval;
      }
    }

    return res;
  }

  /* ================= 类别排序 ================= */
  function catKey(c) {
    var m = c.match(/^单式(\d+)个$/);  if (m) return [0, +m[1]];
    m = c.match(/^复式(\d+)个$/);      if (m) return [1, +m[1]];
    m = c.match(/^胆拖(\d+)胆$/);      if (m) return [2, +m[1]];
    return [3, 0];
  }
  function catUnion(getter) {
    var set = {};
    groups.forEach(function (g) {
      var o = getter(g);
      if (!o) return;
      Object.keys(o).forEach(function (k) { set[k] = 1; });
    });
    return Object.keys(set).sort(function (a, b) {
      var ka = catKey(a), kb = catKey(b);
      if (ka[0] !== kb[0]) return ka[0] - kb[0];
      if (ka[1] !== kb[1]) return ka[1] - kb[1];
      return a.localeCompare(b);
    });
  }

  /* ================= 取值 / 区间文本 ================= */
  function collect(fn) {
    var arr = [];
    groups.forEach(function (g) {
      var v = fn(g);
      if (v !== undefined && v !== null && !isNaN(v)) arr.push(v);
    });
    return arr;
  }
  function pctRange(label, arr) {
    if (!arr.length) return '';
    var min  = Math.min.apply(null, arr).toFixed(2);
    var max  = Math.max.apply(null, arr).toFixed(2);
    var list = arr.map(function (v) { return v.toFixed(2) + '%'; }).join('、');
    return label + '范围是' + min + '%-' + max + '%(一共' + arr.length + '组，分别是' + list + ')';
  }
  function numRange(label, arr) {
    if (!arr.length) return '';
    var min  = Math.min.apply(null, arr);
    var max  = Math.max.apply(null, arr);
    var list = arr.join('、');
    return label + '范围是' + min + '-' + max + '(一共' + arr.length + '组，分别是' + list + ')';
  }
  function joinRanges() {
    return Array.prototype.slice.call(arguments).filter(Boolean).join('，');
  }
  function block(title, entries) {
    if (!entries.length) return '';
    return title + '\n\n' + entries.join('\n\n') + '\n\n';
  }

  /* ================= 汇总生成 ================= */
  function buildResult() {
    var out = '';

    out += '一共输入了' + groups.length + '组结果\n\n';

    /* ---------- 1. 奖金情况 ---------- */
    var bonusAllPct = collect(function (g) { return g.bonus.all && g.bonus.all.pct; });
    if (bonusAllPct.length) {
      var e1 = [];
      e1.push(joinRanges(
        pctRange('全部奖金占比', bonusAllPct),
        pctRange('有奖金的行数占比',
          collect(function (g) { return g.bonus.all && g.bonus.all.winPct; })),
        numRange('有奖金的行数',
          collect(function (g) { return g.bonus.all && g.bonus.all.winNum; }))
      ));
      catUnion(function (g) { return g.bonus.cats; }).forEach(function (c) {
        e1.push(joinRanges(
          pctRange(c + '奖金占比',
            collect(function (g) { return g.bonus.cats[c] && g.bonus.cats[c].pct; })),
          pctRange('有奖金的行数占比',
            collect(function (g) { return g.bonus.cats[c] && g.bonus.cats[c].winPct; })),
          numRange('有奖金的行数',
            collect(function (g) { return g.bonus.cats[c] && g.bonus.cats[c].winNum; }))
        ));
      });
      out += block('❗️奖金情况', e1);
    }

    /* ---------- 2. 后区全中情况 ---------- */
    var backAllPct = collect(function (g) { return g.back.all && g.back.all.pct; });
    if (backAllPct.length) {
      var e2 = [];
      e2.push(joinRanges(
        pctRange('全部后区全中的行数比例', backAllPct),
        numRange('行数',
          collect(function (g) { return g.back.all && g.back.all.num; }))
      ));
      catUnion(function (g) { return g.back.cats; }).forEach(function (c) {
        e2.push(joinRanges(
          pctRange(c + '后区全中的行数比例',
            collect(function (g) { return g.back.cats[c] && g.back.cats[c].pct; })),
          numRange('行数',
            collect(function (g) { return g.back.cats[c] && g.back.cats[c].num; }))
        ));
      });
      out += block('❗️后区全中情况', e2);
    }

    /* ---------- 3. 中4个情况 ---------- */
    var has4 = groups.some(function (g) { return !!g.hits['4']; });
    if (has4) {
      var e4 = [];
      e4.push(joinRanges(
        pctRange('全部中4个的行数占比',
          collect(function (g) { return g.hits['4'] && g.hits['4'].all && g.hits['4'].all.pct; })),
        numRange('行数',
          collect(function (g) { return g.hits['4'] && g.hits['4'].all && g.hits['4'].all.num; }))
      ));
      catUnion(function (g) { return g.hits['4'] && g.hits['4'].cats; }).forEach(function (c) {
        e4.push(joinRanges(
          pctRange(c + '中4个的行数占比',
            collect(function (g) { return g.hits['4'] && g.hits['4'].cats[c] && g.hits['4'].cats[c].pct; })),
          numRange('行数',
            collect(function (g) { return g.hits['4'] && g.hits['4'].cats[c] && g.hits['4'].cats[c].num; }))
        ));
      });
      out += block('❗️中4个情况', e4);
    }

    /* ---------- 4. 中3个情况 ---------- */
    var has3 = groups.some(function (g) { return !!g.hits['3']; });
    if (has3) {
      var e5 = [];
      e5.push(joinRanges(
        pctRange('全部中3个的行数占比',
          collect(function (g) { return g.hits['3'] && g.hits['3'].all && g.hits['3'].all.pct; })),
        numRange('行数',
          collect(function (g) { return g.hits['3'] && g.hits['3'].all && g.hits['3'].all.num; }))
      ));
      catUnion(function (g) { return g.hits['3'] && g.hits['3'].cats; }).forEach(function (c) {
        e5.push(joinRanges(
          pctRange(c + '中3个的行数占比',
            collect(function (g) { return g.hits['3'] && g.hits['3'].cats[c] && g.hits['3'].cats[c].pct; })),
          numRange('行数',
            collect(function (g) { return g.hits['3'] && g.hits['3'].cats[c] && g.hits['3'].cats[c].num; }))
        ));
      });
      out += block('❗️中3个情况', e5);
    }

    /* ---------- 5. 中X➕Y 详情 ---------- */
    var hitOrder = ['4➕1', '4➕0', '3➕2', '3➕1', '2➕2', '3➕0', '2➕1', '1➕2', '0➕2'];

    hitOrder.forEach(function (h) {
      var has = groups.some(function (g) { return !!g.hits[h]; });
      if (!has) return;

      var title = '❗️中' + h + '详情';
      var e = [];

      e.push(joinRanges(
        pctRange('全部中' + h + '的行数占比',
          collect(function (g) { return g.hits[h] && g.hits[h].all && g.hits[h].all.pct; })),
        numRange('行数',
          collect(function (g) { return g.hits[h] && g.hits[h].all && g.hits[h].all.num; }))
      ));

      catUnion(function (g) { return g.hits[h] && g.hits[h].cats; }).forEach(function (c) {
        e.push(joinRanges(
          pctRange(c + '中' + h + '的行数占比',
            collect(function (g) { return g.hits[h] && g.hits[h].cats[c] && g.hits[h].cats[c].pct; })),
          numRange('行数',
            collect(function (g) { return g.hits[h] && g.hits[h].cats[c] && g.hits[h].cats[c].num; }))
        ));
      });

      out += block(title, e);
    });

    /* ---------- 6. 单式5个有奖金的不重复行情况 ---------- */
    var hasUnique = groups.some(function (g) {
      return Object.keys(g.unique.byCount).length > 0 || Object.keys(g.unique.byCombo).length > 0;
    });
    if (hasUnique) {
      var e6 = [];
      // 按“中X个”输出（4、3、2）
      ['4', '3', '2'].forEach(function (k) {
        var p = collect(function (g) { return g.unique.byCount[k] && g.unique.byCount[k].pct; });
        if (!p.length) return;
        e6.push(joinRanges(
          pctRange('单式5个中' + k + '个的行数占比', p),
          numRange('行数',
            collect(function (g) { return g.unique.byCount[k] && g.unique.byCount[k].num; }))
        ));
      });
      // 按“中X➕Y”输出
      ['4➕1', '4➕0', '3➕2', '3➕1', '2➕2', '3➕0', '2➕1', '1➕2', '0➕2'].forEach(function (k) {
        var p = collect(function (g) { return g.unique.byCombo[k] && g.unique.byCombo[k].pct; });
        if (!p.length) return;
        e6.push(joinRanges(
          pctRange('单式5个中' + k + '的行数占比', p),
          numRange('行数',
            collect(function (g) { return g.unique.byCombo[k] && g.unique.byCombo[k].num; }))
        ));
      });
      out += block('❗️单式5个有奖金的不重复行情况', e6);
    }

    return out.replace(/\n{3,}/g, '\n\n').trim();
  }

  /* ================= 事件 ================= */
  addBtn.addEventListener('click', function () {
    var txt = inputEl.value.trim();
    if (!txt) { alert('请先粘贴结果内容'); return; }

    var parsed;
    try { parsed = parseOne(txt); }
    catch (e) { alert('解析出错：' + e.message); return; }

    var ok = parsed.bonus.all || Object.keys(parsed.hits).length > 0 || parsed.back.all;
    if (!ok) { alert('未识别到有效内容，请检查粘贴的格式是否正确。'); return; }

    groups.push(parsed);
    inputEl.value = '';
    resultWrap.style.display = 'none';

    statusEl.textContent = '已录入第 ' + groups.length + ' 组结果。请继续粘贴下一组，或点击【结束输出】。';
    endBtn.disabled = false;
    inputEl.focus();
  });

  endBtn.addEventListener('click', function () {
    if (!groups.length) { alert('还没有录入任何结果'); return; }
    resultText.textContent = buildResult();
    resultWrap.style.display = 'block';
    statusEl.textContent = '✅ 统计完成，共 ' + groups.length + ' 组结果。点击【一键复制】即可复制。';
    resultWrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  resetBtn.addEventListener('click', function () {
    if (!confirm('确定要清空所有已录入的结果吗？')) return;
    groups = [];
    inputEl.value = '';
    resultText.textContent = '';
    resultWrap.style.display = 'none';
    endBtn.disabled = true;
    statusEl.textContent = '请粘贴第 1 组结果，然后点击【确定（录入本组）】。';
    inputEl.focus();
  });

  copyBtn.addEventListener('click', function () {
    var text = resultText.textContent;
    if (!text) return;

    var done = function () {
      var old = copyBtn.textContent;
      copyBtn.textContent = '✅ 已复制';
      setTimeout(function () { copyBtn.textContent = old; }, 1500);
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () {
        fallbackCopy(text, done);
      });
    } else {
      fallbackCopy(text, done);
    }
  });

  function fallbackCopy(text, cb) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    if (cb) cb();
  }

})();
</script>
</body>
</html>
